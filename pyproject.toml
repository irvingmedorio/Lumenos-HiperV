[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenos-sandbox"
version = "2.1.0"
description = "Sistema de Aislamiento Multinivel para Pruebas de Malware en Windows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Irvin Diaz Medorio"}]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]
analysis = ["psutil>=5.9.0", "cryptography>=40.0.0"]
secrets = ["keyring>=24.0.0"]
api = ["fastapi>=0.104.0", "uvicorn[standard]>=0.24.0", "httpx>=0.25.0"]

[project.scripts]
lumenos = "lumenos_sandbox.cli:main"

[tool.setuptools.packages.find]
include = ["lumenos_sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
