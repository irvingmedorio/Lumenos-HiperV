# LUMENOS SANDBOX ARCHITECTURE
# Archivo de Configuración Principal
# Autor: Irvin Diaz Medorio

[system]
# Configuración del sistema de bunkers
system_id = lumenos_production
system_name = Lumenos Sandbox Architecture
version = 1.0.0

[bunker]
# Configuración por defecto de bunkers
default_memory_mb = 8192
default_cpu_cores = 4
default_disk_gb = 100
max_session_hours = 24
min_decontamination_minutes = 30
snapshot_interval_minutes = 5

[security]
# Configuración de seguridad
enable_network_isolation = true
enable_memory_encryption = true
enable_secure_boot = true
enable_tpm_verification = true
enable_nested_virtualization = false

# Umbrales de detección
max_network_bytes_per_second = 1024
max_file_operations_per_minute = 100
max_memory_alloc_mb = 100
max_clipboard_size_kb = 1

[integrity]
# Configuración de verificación de integridad
hash_algorithm = sha512
verification_interval_seconds = 60
baseline_update_enabled = false

# Componentes críticos a monitorear
critical_components = hypervisor_config,base_image,security_policies,network_rules,process_whitelist,memory_layout

[logging]
# Configuración de logging
log_level = VERBOSE
log_dir = logs
max_log_size_mb = 100
log_retention_days = 30
enable_audit_log = true
enable_forensic_log = true

[alerts]
# Configuración de alertas
enable_email_alerts = false
enable_syslog = false
alert_on_leak_detection = true
alert_on_corruption = true
alert_on_escape_attempt = true
alert_on_integrity_failure = true

[performance]
# Configuración de rendimiento
max_concurrent_bunkers = 2
metrics_collection_interval = 1
enable_performance_logging = true

[paths]
# Rutas del sistema
base_image_path = images/base/
snapshot_path = snapshots/
log_path = logs/
config_path = config/
temp_path = temp/

[experimental]
# Características experimentales
enable_side_channel_detection = false
enable_behavioral_analysis = false
enable_ml_threat_detection = false
